# Exemplo de configuração do Arcadia. Nomes e pastas aqui são genéricos: o repositório é público.
# A configuração real fica fora do repositório, em %USERPROFILE%\.arcadia\arcadia.config.yaml.
# Caminhos aceitam ~ (pasta do usuário) e barras normais. No Windows, a comparação ignora maiúsculas.
versao: 1

servidor:
  # Ingestão de hooks, saúde e doctor: só na própria máquina.
  ingestao:
    host: 127.0.0.1
    porta: 47800
  # Navegador do PC e do celular: só dados saneados. Fica em 127.0.0.1 até existir o pareamento
  # (Fase 4) e a rede de casa estar liberada (scripts/rede-local.ps1); antes disso, 0.0.0.0 só gera aviso.
  visualizacao:
    host: 127.0.0.1
    porta: 4780
  pareamento:
    validadeCodigoMinutos: 5
  dados: "%LOCALAPPDATA%/Arcadia/dados"
  retencaoDias: 180

fontes:
  openmausbot:
    ligado: true
    portas: [8799, 18799, 28799]   # a primeira que responder ao /.well-known/openmausbot/environment
    # As rotas permitidas ficam fixas no código (só GET e o SSE com screens=off).
    # Bots com pasta privada de tarefa vão para a sala do QG da equipe:
    qgPorEquipe:
      "Equipe exemplo": "~/projetos/estudio-exemplo"
  claudeTranscricoes:
    ligado: true
    pasta: "~/.claude/projects"
    catchUpHoras: 24
  claudeSessoesVivas:
    ligado: true
    pasta: "~/.claude/sessions"   # só os .json; os .key nunca são abertos
  codexRollouts:
    ligado: true
    pasta: "~/.codex/sessions"
  claudeHooks:
    ligado: false   # Fase 6, só com o ok do dono da máquina
  codexHooks:
    ligado: false   # Fase 6, só com o ok do dono da máquina
  git:
    ligado: false   # Fase 5: entregas por git log -1, só leitura
  otel:
    ligado: false   # opcional: custo e tokens agregados

privacidade:
  mostrarNomeCurtoDoArquivo: false   # cartões mostram só a categoria da ferramenta
  mostrarTituloDaTarefa: true        # título saneado (regex de segredos antes de sair)

mundo:
  fuso: America/Sao_Paulo
  fps:
    pc: 60
    celular: 30
  qualidade:
    pc: alto
    celular: medio   # baixo, medio ou alto; ?q= força na URL
  ocio:
    pausaMinutos: 3
    dormeMinutos: 20

# Alas são as frentes de trabalho. A ordem define a posição no andar e nunca muda depois de criada.
# Sala = raiz git da pasta de trabalho; sem git, a regra de pasta agregadora ou a própria pasta.
# Cada ala aceita um `tipo` opcional (web, app, video, backend, pesquisa ou outro): é o modelo de mobília
# das salas novas dessa ala.
alas:
  - id: estudio
    nome: Estúdio
    cor: "#ffb347"
    tipo: video
    regras: ["~/projetos/estudio-*/**", "~/videos/**"]
  - id: produtos
    nome: Produtos
    cor: "#c9a7ff"
    regras: ["~/projetos/produto-*/**"]
  - id: trabalho
    nome: Trabalho
    cor: "#a9b3d6"
    regras: ["~/empresa/**"]
  - id: estudos
    nome: Estudos
    cor: "#3fd28b"
    regras: ["~/estudos/**"]
  - id: cockpit
    nome: Cockpit
    cor: "#f2b45a"
    regras: ["~/projetos"]   # sessões abertas na raiz da pasta agregadora
  - id: bastidores
    nome: Bastidores
    cor: "#6fd3ff"
    regras: ["~", "%TEMP%/**"]

# Sem regra, a sala espera na Recepção até ser classificada aqui.
recepcao:
  id: recepcao
  nome: Recepção
  cor: "#ffe08a"

salas:
  # Quem decide a sala do agente: o cwd da sessão quando ela aparece (ou quando o cwd muda de sala) e o arquivo que
  # uma ferramenta grava numa sala de projeto (raiz git, subpasta de pasta agregadora ou pasta com apelido). Leitura
  # e busca em outro projeto só levam o agente depois de três seguidas na mesma sala. Evento sem caminho deixa o
  # agente onde está, e pasta comum sem git vira sala só pelo cwd.
  # Cada subpasta de primeiro nível destas pastas vira uma sala (quando não há raiz git).
  # O .git só é procurado dentro de raízes conhecidas (casa, regras das alas, agregadoras e apelidos).
  # Fora delas o disco não é consultado: a sessão aberta numa pasta de lá ganha a sala da própria pasta, e
  # arquivo mexido lá não cria sala (o agente fica na sala em que está). Se o doctor contar salas que nasceram
  # fora das raízes conhecidas, crie uma regra de ala ou uma pasta agregadora que cubra essas pastas.
  # Disco lento: cada consulta tem prazo de 2 s; sem resposta, o caminho fica sem sala por enquanto (nunca
  # vira a sala errada) e a raiz que demorou fica alguns minutos sem consulta.
  # As pastas dos próprios agentes (~/.claude, ~/.codex, ~/.openmausbot) e os dados do Arcadia viram
  # salas de nome fixo na ala que casa com ~; caminho de rede ou do WSL vira a sala fixa "Pasta de rede".
  pastasAgregadoras: ["~/projetos", "~/videos"]
  # Pastas de apoio (só o nome): na raiz de uma pasta agregadora, a subpasta com um destes nomes não vira sala; ela
  # conta para a sala da própria agregadora, e arquivo dela não leva o agente para lá.
  pastasDeApoio: [docs, doc, tmp, temp, scripts, assets, public, static, dist, build, out, logs, data, test, tests, tools, .github, .vscode, .cache, node_modules]
  # Pastas de rascunho: arquivo mexido ali nunca cria sala nem move o agente. Sessão aberta ali (cwd) continua
  # ganhando sala pela regra de sempre.
  rascunho: ["%TEMP%"]
  # Nunca viram sala e nunca são lidas; cada padrão vale também para as subpastas. A sessão que mexe numa
  # pasta excluída (ou cujo subagente mexe) aparece sem nome, tarefa e nome de arquivo dali em diante, também
  # depois de reiniciar. O bot fica sem tarefa e sem nome de arquivo só até o próximo turno (o nome dele fica),
  # e o turno de quem delegou a tarefa a ele também.
  excluir: ["**/senhas/**", "**/*segredo*/**", "**/*recovery*"]
  # Apelido mostrado no mundo no lugar do nome da pasta.
  apelidos:
    "~/projetos/produto-alfa": Alfa

personagens:
  # Personagens pessoais (aparência e sprites) ficam num pacote local, fora do Git.
  pacoteLocal: "%USERPROFILE%/.arcadia/personagens"
  humanos: []   # o repositório traz só personagens genéricos
